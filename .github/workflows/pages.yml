name: Deploy RumahNusa to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Create Supabase browser config
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$SUPABASE_KEY" ]; then
            echo "SUPABASE_KEY repository secret is missing."
            exit 1
          fi
          printf "window.RUMAHNUSA_SUPABASE_URL='https://vuhrkijzjmnbsaqnpdmg.supabase.co';\nwindow.RUMAHNUSA_SUPABASE_PUBLISHABLE_KEY='%s';\n" "$SUPABASE_KEY" > supabase-config.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
