<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RumahNusa Real Estate</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  width: 100%;
  max-width: 100%;
  min-width: 0;
  overflow-x: hidden;
}

body {
  min-height: 100vh;
}

img, video, iframe, svg, canvas {
  max-width: 100%;
}

button, input, select, textarea {
  max-width: 100%;
}

body {
  font-family: Arial, sans-serif;
  color: #27272a;
  background: #ffffff;
  line-height: 1.6;
}

header {
  background: white;
  padding: 18px 7%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  z-index: 10;
  box-shadow: 0 2px 12px rgba(0,0,0,.08);
}

.logo {
  font-size: 24px;
  font-weight: bold;
  color: #b91c1c;
}

.logo span {
  color: #dc2626;
}

nav a {
  text-decoration: none;
  color: #3f3f46;
  margin-left: 22px;
  font-weight: 600;
}

.hero {
  min-height: 520px;
  padding: 90px 7%;
  color: white;
  display: flex;
  align-items: center;
  background:
    linear-gradient(rgba(3,30,52,.65),rgba(3,30,52,.65)),
    url("https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?auto=format&fit=crop&w=1600&q=80")
    center/cover;
}

.hero-content {
  max-width: 650px;
}

.hero small {
  letter-spacing: 3px;
  font-weight: bold;
}

.hero h1 {
  font-size: 52px;
  line-height: 1.1;
  margin: 15px 0;
}

.hero h1 span {
  color: #dc2626;
}

.hero p {
  font-size: 19px;
  margin-bottom: 30px;
}

/* Stable mobile layout: keep the hero and all text inside the screen. */
.hero > * { min-width: 0; }
.agent-team-photo {
  width: 100%;
  max-width: 520px;
  flex: 0 1 520px;
  overflow: hidden;
}
.agent-team-photo img {
  display: block;
  width: 100%;
  max-width: 100%;
  height: auto;
  object-fit: cover;
}
@media (max-width: 800px) {
  .hero {
    min-height: auto;
    padding: 42px 20px 48px;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 24px;
    overflow: hidden;
  }
  .agent-team-photo,
  .hero-content {
    width: 100%;
    max-width: 100%;
    flex: none;
  }
  .hero h1 {
    font-size: clamp(34px, 10vw, 46px);
    line-height: 1.12;
    overflow-wrap: anywhere;
  }
  .hero p {
    font-size: 17px;
    line-height: 1.55;
  }
  .hero small {
    font-size: 12px;
    letter-spacing: 2px;
  }
  .bilingual {
    max-width: 100%;
    overflow-wrap: anywhere;
  }
}
@media (max-width: 480px) {
  .hero { padding-left: 16px; padding-right: 16px; }
  .hero h1 { font-size: 34px; }
  .hero p { font-size: 16px; }
}

.search-box {
  background: white;
  padding: 18px;
  border-radius: 14px;
  display: flex;
  gap: 12px;
  max-width: 900px;
  margin-top: 25px;
}

.search-box input,
.search-box select {
  flex: 1;
  padding: 14px;
  border: 1px solid #e4e4e7;
  border-radius: 8px;
  min-width: 0;
}

/* RumahNusa mobile-style bottom navigation */
.rn-bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:15000;
  display:grid;
  grid-template-columns:repeat(6,minmax(0,1fr));
  gap:0;
  padding:7px 4px max(7px,env(safe-area-inset-bottom));
  background:rgba(255,255,255,.98);
  border-top:1px solid #e4e4e7;
  box-shadow:0 -5px 20px rgba(16,42,67,.12);
  backdrop-filter:blur(10px);
}
.rn-bottom-nav button{
  appearance:none;
  border:0;
  background:transparent;
  color:#52525b;
  min-width:0;
  min-height:62px;
  padding:5px 2px 3px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  font:inherit;
  font-size:11px;
  font-weight:700;
  cursor:pointer;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
.rn-bottom-nav button svg{
  width:25px;
  height:25px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.9;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.rn-bottom-nav button.active{color:#e64b4b}
.rn-bottom-nav button:active{transform:scale(.94)}
body{padding-bottom:82px}
@media(min-width:801px){
  .rn-bottom-nav{max-width:760px;left:50%;right:auto;transform:translateX(-50%);width:100%;border:1px solid #e4e4e7;border-bottom:0;border-radius:18px 18px 0 0}
}
@media(max-width:420px){
  .rn-bottom-nav button{font-size:10px;min-height:58px}
  .rn-bottom-nav button svg{width:23px;height:23px}
}

.rn-listing{cursor:pointer;transition:transform .18s,box-shadow .18s;border:2px solid transparent}.rn-listing:hover,.rn-listing:focus-within{transform:translateY(-3px);box-shadow:0 10px 28px rgba(16,42,67,.16);border-color:#dc2626}.rn-listing:active{transform:scale(.995)}
}

.rn-listing{cursor:pointer;touch-action:manipulation}
.rn-listing:focus-visible{outline:3px solid #dc2626;outline-offset:3px}
.rn-home-viewer{position:fixed;inset:0;z-index:20000;background:rgba(0,0,0,.72);display:flex;align-items:flex-start;justify-content:center;overflow:auto}
.rn-home-viewer[hidden]{display:none!important}
.rn-home-viewer-panel{width:min(760px,100%);min-height:100%;background:#fff;color:#27272a}
.rn-home-viewer-top{position:sticky;top:0;z-index:2;background:#dc2626;color:#fff;padding:16px 18px;display:flex;align-items:center;gap:14px}
.rn-home-viewer-title{font-size:20px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rn-home-viewer-close{margin-left:auto;background:transparent;border:0;color:#fff;font-size:17px;padding:8px 10px;cursor:pointer}
.rn-home-viewer-tabs{display:flex;gap:28px;padding:12px 18px;border-bottom:1px solid #e4e4e7}
.rn-home-viewer-tab{border:0;background:transparent;padding:8px 2px;font-weight:800;font-size:16px;cursor:pointer}
.rn-home-viewer-tab.active{color:#dc2626;border-bottom:3px solid #dc2626}
.rn-home-viewer-photo{padding:18px}
.rn-home-viewer-photo img{width:100%;display:block;aspect-ratio:16/10;object-fit:cover;border-radius:14px}
.rn-home-viewer-section{padding:0 18px 18px}
.rn-home-viewer-section h4{margin:8px 0 10px;font-size:20px}
.rn-home-viewer-chips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.rn-home-viewer-chip{padding:14px;border:1px solid #e4e4e7;border-radius:12px;background:#fffafa;font-weight:700}

.rn-home-viewer-note{padding:0 18px 18px;color:#71717a;font-size:13px;line-height:1.5}
@media(max-width:520px){.rn-home-viewer-chips{grid-template-columns:1fr}.rn-home-viewer-title{font-size:17px}}
.rn-home-viewer-back{border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:10px;padding:9px 12px;font-weight:700;font-size:14px;cursor:pointer;touch-action:manipulation}.rn-home-viewer-back:active{transform:scale(.98)}</style>
<style id="rn-buy-section-polish">
.rn-buy-choice-strip{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0 0 18px}
.rn-buy-choice{padding:14px;border:1px solid #fecaca;border-radius:14px;background:#fff}
.rn-buy-choice strong{display:block;color:#991b1b;font-size:15px;margin-bottom:4px}
.rn-buy-choice span{display:block;color:#52525b;font-size:13px;line-height:1.5}
.rn-buy-choice.apartment{grid-column:1/-1;background:linear-gradient(135deg,#fff1f2,#fff)}
@media(max-width:600px){.rn-buy-choice-strip{grid-template-columns:1fr}.rn-buy-choice.apartment{grid-column:auto}}
.rn-buy-overview{margin:20px 0 22px;padding:20px;border:1px solid #fecaca;border-radius:20px;background:linear-gradient(180deg,#fff,#fff7f7);box-shadow:0 10px 30px rgba(153,27,27,.08)}
.rn-buy-overview-head{display:flex;align-items:center;gap:13px;color:#991b1b}.rn-buy-overview-head>span{font-size:34px}.rn-buy-overview-head strong{display:block;font-size:21px}.rn-buy-overview-head small{display:block;color:#71717a;margin-top:2px}
.rn-buy-rules{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:16px}.rn-buy-rules>div{padding:14px;border-radius:14px;background:#fff;border:1px solid #f1f1f1}.rn-buy-rules b{display:block;color:#991b1b;margin-bottom:4px}.rn-buy-rules span{display:block;color:#52525b;font-size:13px;line-height:1.5}
.rn-price-pending{color:#71717a!important;font-weight:600!important;font-size:14px!important}.rn-complete-property-note{background:#fff7f7;padding:10px 12px;border-radius:10px;color:#52525b}.rn-category-head{background:linear-gradient(135deg,#fff1f2,#fff);padding:18px;border-radius:16px;border:1px solid #fecaca;margin-bottom:16px}.rn-category-head h4{color:#991b1b;font-size:23px}.rn-category-badge{background:#dc2626!important;color:#fff!important;padding:6px 10px;border-radius:999px;font-weight:800}
@media(max-width:700px){.rn-buy-rules{grid-template-columns:1fr}.rn-buy-overview{padding:16px}.rn-buy-overview-head strong{font-size:19px}}
</style>

<style>
/* Final mobile tap fix: every home category is a real, full-size touch target. */
#propertyOptions .rn-home-category{
  position:relative!important;
  z-index:50!important;
  pointer-events:auto!important;
  touch-action:manipulation!important;
  -webkit-tap-highlight-color:rgba(8,121,189,.18)!important;
  user-select:none!important;
  cursor:pointer!important;
}
#propertyOptions .rn-home-category:active{
  transform:scale(.98)!important;
}
</style>
<script>
/* Final direct category tap fix: capture Android touch/clicks before any
   other page handler, then open the selected category immediately. */
(function(){
  function open(button){
    const name=button?.dataset?.value||'';
    if(!name) return;
    if(history.state?.rnCategory!==name){
      history.pushState({rnCategory:name},'',location.href);
    }
    if(typeof window.__rnOpenCategory==='function'){
      window.__rnOpenCategory(name);
    }
  }
  document.addEventListener('click',function(event){
    const button=event.target?.closest?.('#propertyOptions .rn-home-category');
    if(!button) return;
    event.preventDefault();
    event.stopPropagation();
    open(button);
  },true);
  document.addEventListener('pointerup',function(event){
    const button=event.target?.closest?.('#propertyOptions .rn-home-category');
    if(!button) return;
    if(event.pointerType==='mouse' && event.button!==0) return;
    event.preventDefault();
    event.stopPropagation();
    open(button);
  },true);
})();
</script>
<script>
/* FINAL CATEGORY FALLBACK: if an older handler throws, the tapped
   category must still open visibly on the same screen. */
(function(){
  function forceOpen(button){
    const collection=document.getElementById('rnCategoryCollection');
    const grid=document.getElementById('propertyOptions');
    const listings=document.getElementById('rnCategoryListings');
    if(!button||!collection||!grid)return;
    const name=button.dataset.value||'';
    const d=window.__rnCategoryDataMap?.[name] || (name==='Vila' ? {title:'Villas',badge:'VILLA',intro:'Villa homes available in Bali.',buy:'Villas are presented as sale properties.',listings:window.__rnVillaFallbackListings||[]} : null);
    grid.classList.add('rn-category-open');
    grid.querySelectorAll('.rn-home-category').forEach(x=>x.classList.toggle('selected',x===button));
    collection.hidden=false;
    button.insertAdjacentElement('afterend',collection);

    const title=document.getElementById('rnCategoryTitle');
    const intro=document.getElementById('rnCategoryIntro');
    const badge=document.getElementById('rnCategoryBadge');
    if(title) title.textContent=d?.title||((button.querySelector('strong')?.textContent||'Selected category')+' homes');
    if(intro) intro.textContent=d?.intro||'Homes in this category are now open below. Choose a home to continue.';
    if(badge) badge.textContent=d?.badge||(button.querySelector('strong')?.textContent||'CATEGORY').toUpperCase();

    /* Populate the cards independently of the main renderer. This is the
       important recovery path when the normal renderer was interrupted. */
    if(listings && d?.listings?.length){
      const rate=17900;
      const idr=n=>'Rp '+Math.round(n).toLocaleString('id-ID');
      const displayPrice=p=>'Price will be added later when this property is ready.';
      listings.innerHTML=d.listings.map(x=>
        '<article class="rn-listing">'+
        '<img loading="eager" src="'+x[4]+'" alt="'+x[0]+'">'+
        '<div class="rn-listing-body">'+
        '<h5>'+x[0]+'</h5>'+
        '<p>📍 '+x[1]+'</p>'+
        '<p class="rn-listing-price">'+displayPrice(x[2])+'</p>'+
        '<div class="rn-listing-specs">'+String(x[3]).split(' · ').map(s=>'<span>'+s+'</span>').join('')+'</div>'+
        '<p>'+String(d.buy||'')+'</p>'+
        '<button type="button" class="rn-listing-continue">Continue with this home</button>'+
        '</div></article>'
      ).join('');
    }

    collection.scrollIntoView({behavior:'smooth',block:'start'});
  }
  function open(button){
    const name=button?.dataset?.value||'';
    if(!name)return;
    try{
      if(typeof window.__rnOpenCategory==='function') window.__rnOpenCategory(name);
      else forceOpen(button);
    }catch(error){
      console.warn('RumahNusa category renderer recovered from an error.',error);
      forceOpen(button);
    }
    setTimeout(()=>{
      const collection=document.getElementById('rnCategoryCollection');
      const grid=document.getElementById('propertyOptions');
      if(collection&&grid&&collection.hidden) forceOpen(button);
    },80);
  }
  document.addEventListener('click',function(e){
    const button=e.target?.closest?.('#propertyOptions .rn-home-category');
    if(!button)return;
    e.preventDefault();
    e.stopPropagation();
    open(button);
  },true);
  document.addEventListener('pointerup',function(e){
    const button=e.target?.closest?.('#propertyOptions .rn-home-category');
    if(!button)return;
    e.preventDefault();
    e.stopPropagation();
    open(button);
  },true);
})();
</script>
</html>
